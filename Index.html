<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Danatx Games 🎮</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0b0b12;
  color:white;
}
header{
  padding:25px 18px;
  text-align:center;
  background:linear-gradient(135deg,#17172b,#101018);
}
.logo{font-size:30px;font-weight:800}
.sub{color:#999;margin-top:6px}
.container{padding:18px}
h2{font-size:20px}
.games{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
.game{
  background:#171722;
  border:1px solid #292938;
  border-radius:16px;
  padding:22px 10px;
  text-align:center;
  font-size:17px;
  cursor:pointer;
}
.game:active{transform:scale(.97)}
.icon{font-size:38px;display:block;margin-bottom:8px}
.telegram{
  margin-top:20px;
  display:block;
  text-align:center;
  background:#229ED9;
  color:white;
  padding:14px;
  border-radius:13px;
  text-decoration:none;
  font-weight:bold;
}
#shop{display:none}
.back{
  background:#252535;
  border:0;
  color:white;
  padding:10px 16px;
  border-radius:10px;
  margin-bottom:15px;
}
.card{
  background:#171722;
  padding:16px;
  border-radius:14px;
  margin:10px 0;
}
.price{
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.buy{
  background:#6c5ce7;
  border:0;
  color:white;
  padding:9px 14px;
  border-radius:9px;
}
input,select{
  width:100%;
  padding:13px;
  margin:7px 0;
  border:0;
  border-radius:10px;
  background:#252535;
  color:white;
}
</style>
</head>

<body>

<header>
  <div class="logo">🎮 Danatx Games</div>
  <div class="sub">Game Top Up</div>
</header>

<div class="container" id="home">
  <h2>🎮 Игро интихоб кун</h2>

  <div class="games">
    <div class="game" onclick="openGame('Free Fire')">
      <span class="icon">🔥</span>Free Fire
    </div>

    <div class="game" onclick="openGame('PUBG Mobile')">
      <span class="icon">🎯</span>PUBG Mobile
    </div>

    <div class="game" onclick="openGame('Brawl Stars')">
      <span class="icon">⭐</span>Brawl Stars
    </div>

    <div class="game" onclick="openGame('Standoff 2')">
      <span class="icon">🔫</span>Standoff 2
    </div>

    <div class="game" onclick="openGame('Minecraft')">
      <span class="icon">⛏️</span>Minecraft
    </div>
  </div>

  <a class="telegram" href="https://t.me/AmirDonateBot">
    📲 Telegram
  </a>
</div>

<div class="container" id="shop">
  <button class="back" onclick="goBack()">← Бозгашт</button>

  <h2 id="gameName"></h2>

  <div id="products"></div>

  <div class="card">
    <h3>🆔 Player ID</h3>
    <input id="playerId" placeholder="ID-и бозигарро навис">

    <h3>💳 Пардохт</h3>
    <select id="payment">
      <option>Alif</option>
      <option>Dushanbe City</option>
      <option>Eskhata</option>
    </select>

    <button class="buy" style="width:100%;padding:14px;margin-top:10px"
      onclick="order()">
      🛒 Фармоиш додан
    </button>
  </div>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

let selectedGame = "";
let selectedPackage = "";

const ffProducts = [
  ["💎 100 Diamonds","9.30 TJS"],
  ["🎟️ Lite Voucher","4.50 TJS"],
  ["🎟️ Weekly Voucher","15.50 TJS"],
  ["🎟️ Monthly Voucher","68.88 TJS"]
];

function openGame(game){
  selectedGame = game;

  document.getElementById("home").style.display="none";
  document.getElementById("shop").style.display="block";
  document.getElementById("gameName").innerText="🎮 "+game;

  const products=document.getElementById("products");
  products.innerHTML="";

  if(game==="Free Fire"){
    ffProducts.forEach(p=>{
      products.innerHTML += `
      <div class="card price">
        <div>
          <b>${p[0]}</b><br>
          <span>${p[1]}</span>
        </div>
        <button class="buy" onclick="selectPackage('${p[0]}')">
          Интихоб
        </button>
      </div>`;
    });
  }else{
    products.innerHTML=`
      <div class="card">
        🔜 Нархи ${game} ҳоло илова нашудааст.
      </div>`;
  }
}

function selectPackage(pkg){
  selectedPackage=pkg;
  tg.showAlert("Интихоб шуд: "+pkg);
}

function order(){
  const id=document.getElementById("playerId").value;
  const payment=document.getElementById("payment").value;

  if(!selectedPackage){
    tg.showAlert("Аввал пакетро интихоб кун.");
    return;
  }

  if(!id){
    tg.showAlert("Player ID-ро ворид кун.");
    return;
  }

  tg.showAlert(
    "✅ Фармоиш қабул шуд!\n\n"+
    "🎮 "+selectedGame+
    "\n📦 "+selectedPackage+
    "\n🆔 "+id+
    "\n💳 "+payment
  );
}

function goBack(){
  document.getElementById("shop").style.display="none";
  document.getElementById("home").style.display="block";
}
</script>

</body>
</html>

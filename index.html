<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DanatX Games</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

body{
  background:#090909;
  color:white;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  min-height:100vh;
}

.app{
  max-width:520px;
  margin:auto;
  min-height:100vh;
  padding-bottom:90px;
}

/* HEADER */
.header{
  height:70px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:12px 16px;
  position:sticky;
  top:0;
  z-index:10;
  background:rgba(9,9,9,.94);
  backdrop-filter:blur(15px);
}

.left{
  display:flex;
  align-items:center;
  gap:12px;
}

.close{
  font-size:29px;
  color:#aaa;
}

.title{
  font-size:18px;
  font-weight:700;
}

.sub{
  color:#888;
  font-size:12px;
  margin-top:2px;
}

.arrow{
  color:#888;
  font-size:15px;
}

.dots{
  font-size:24px;
  color:#aaa;
}

/* BALANCE */
.balance{
  margin:5px 16px 15px;
  background:#171717;
  border:1px solid #292929;
  border-radius:18px;
  padding:13px 16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.balance small{
  color:#888;
  display:block;
  font-size:12px;
}

.balance strong{
  font-size:19px;
}

.plus{
  width:38px;
  height:38px;
  border-radius:13px;
  background:#ff9d00;
  color:#111;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
  font-weight:bold;
}

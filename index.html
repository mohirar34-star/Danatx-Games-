<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Danatx Games 🎮</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0b0f18;
  color:#fff;
}
.app{
  max-width:520px;
  margin:auto;
  padding:18px;
}
.header{
  text-align:center;
  padding:18px 0 22px;
}
.logo{
  font-size:28px;
  font-weight:800;
}
.sub{
  color:#8d96a8;
  margin-top:6px;
}
.section-title{
  font-size:18px;
  font-weight:700;
  margin:20px 0 12px;
}
.games{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
.game{
  background:#151b28;
  border:1px solid #252d3d;
  border-radius:16px;
  padding:18px 10px;
  text-align:center;
  cursor:pointer;
  transition:.15s;
}
.game:active{
  transform:scale(.97);
}
.game.active{
  border-color:#fff;
  background:#20283a;
}
.icon{
  font-size:32px;
  margin-bottom:8px;
}
.card{
  background:#151b28;
  border:1px solid #252d3d;
  border-radius:18px;
  padding:16px;
  margin-top:12px;
}
.category{
  width:100%;
  border:0;
  border-radius:12px;
  padding:13px;
  margin:6px 0;
  background:#20283a;
  color:#fff;
  font-size:15px;
  text-align:left;
  cursor:pointer;
}
.product{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  background:#101620;
  border:1px solid #252d3d;
  border-radius:13px;
  padding:13px;
  margin:8px 0;
  cursor:pointer;
}
.product:hover{
  border-color:#59657c;
}
.price{
  white-space:nowrap;
  font-weight:700;
}
input,select{
  width:100%;
  padding:14px;
  margin:7px 0;
  border-radius:12px;
  border:1px solid #30394b;
  background:#0e141f;
  color:#fff;
  font-size:15px;
}
button{
  font-family:inherit;
}
